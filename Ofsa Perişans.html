/* vivid theme */
:root{--hi:#ffc83d;--hf:#2a1a00;--tile:#fff8e4;--edge:#d8c594;--wood:#c47d3f;--wood2:#7c4620}
body{background:radial-gradient(720px 440px at 8% -6%,rgba(139,92,246,.45),transparent 62%),radial-gradient(720px 440px at 100% 4%,rgba(47,155,255,.38),transparent 62%),linear-gradient(180deg,#10305a,#0a3d4b 55%,#0a4f3c) fixed;color:#fff}
.lg{font:800 27px Georgia,serif;letter-spacing:.5px;background:linear-gradient(90deg,#ffd75e,#ff8a3d,#ff5a8a);-webkit-background-clip:text;background-clip:text;color:transparent}
.prize{background:linear-gradient(135deg,#ffd75e,#ff9f1c);color:#3a2200;box-shadow:0 2px 0 #b86a00}
.sk{background:linear-gradient(180deg,#b79cff,#6d3df0);color:#fff;box-shadow:0 3px 0 #4a24b8}
.dots{flex-basis:100%;display:flex;gap:5px;justify-content:center}
.dots i{flex:1;max-width:40px;height:6px;border-radius:3px;background:rgba(255,255,255,.22)}
.dots i.c{background:linear-gradient(90deg,#ff5a6e,#ffc83d,#35c8ff);opacity:.4}
.dots i.d{opacity:1;background:#fff}.dots i.c.d{background:linear-gradient(90deg,#ff5a6e,#ffc83d,#35c8ff)}
.dots i.n{opacity:1;background:#fff;animation:blink 1s infinite}.dots i.c.n{background:linear-gradient(90deg,#ff5a6e,#ffc83d,#35c8ff)}
@keyframes blink{50%{transform:scaleY(2);box-shadow:0 0 10px #fff}}
.table{grid-template-areas:". top ." "left mid right" "you . me";row-gap:10px;background:radial-gradient(ellipse at 50% 38%,#22c78f 0%,#0e8d65 45%,#06503a 100%);border:5px solid #0a2f45;box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),inset 0 0 44px rgba(0,0,0,.35),0 12px 26px rgba(0,0,0,.45)}
.seat{min-width:0;position:relative;background:linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.15));border:2px solid color-mix(in srgb,var(--pc) 55%,transparent)}
.seat.on{box-shadow:0 0 0 2px var(--pc),0 0 18px color-mix(in srgb,var(--pc) 70%,transparent);animation:ring 1.6s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 0 3px var(--pc),0 0 30px var(--pc)}}
.who{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:4px 6px;font-size:12px}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fffc,var(--pc) 58%);color:#14232b;font:800 13px system-ui,sans-serif;font-style:normal;box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.pt{font-style:normal;background:linear-gradient(135deg,#b79cff,#7c3aed);color:#fff;border-radius:999px;padding:1px 8px;font:800 10px system-ui,sans-serif}
.think{display:flex;gap:4px;height:8px;align-items:center}.think i{width:6px;height:6px;border-radius:50%;background:var(--pc);animation:bob 1s infinite}.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-5px)}}
.you{display:flex;align-items:center;gap:6px;justify-self:start;font-size:12px}.you.on .av{animation:ring2 1.4s infinite}
@keyframes ring2{50%{box-shadow:0 0 0 7px color-mix(in srgb,var(--pc) 55%,transparent)}}
.dz{border-color:rgba(255,255,255,.4)}
.dz.hot,.pile.hot{outline:3px solid #fff;transform:scale(1.12)}
.pile{width:52px;border:3px solid #fff3c4;background:repeating-linear-gradient(45deg,#3a96ff 0 4px,#1b63d6 4px 8px);text-shadow:0 1px 2px rgba(0,0,0,.45);font-size:17px;transition:transform .12s}
.pile.fin{background:repeating-linear-gradient(45deg,#ffd75e 0 4px,#ff9f1c 4px 8px);color:#3a2200;text-shadow:none;animation:pulseg 1s infinite}
@keyframes pulseg{50%{box-shadow:0 0 0 7px rgba(255,200,61,.65),0 0 26px #ffc83d}}
.finlbl{font:800 12px system-ui,sans-serif!important;opacity:1!important;color:#ffd75e;animation:bob 1s infinite}
.t{background:linear-gradient(180deg,#fffdf3,#f6e7be);border-bottom-color:#d8c594;box-shadow:0 2px 3px rgba(0,0,0,.3);transition:transform .12s}
.t.per{border-bottom-color:#22c55e}.t.lo{border-bottom-color:#ffb020}
.rack .t:hover{transform:translateY(-4px)}
.t.sel{outline:3px solid #fff;box-shadow:0 0 16px #ffc83d}.rack .t.sel,.rack .t.sel:hover{transform:translateY(-9px)}
.t.j{box-shadow:0 0 0 2px #ffc83d,0 0 12px rgba(255,200,61,.85)}
.t.back{background:repeating-linear-gradient(45deg,#3a96ff 0 4px,#1b63d6 4px 8px)}
.t.deal{animation:deal .5s cubic-bezier(.2,.8,.3,1) backwards}
@keyframes deal{from{transform:translateY(-70px) rotate(-14deg) scale(.5);opacity:0}}
.cf{position:fixed;top:-16px;width:9px;height:14px;z-index:9;pointer-events:none;border-radius:2px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(720deg)}}
.wood{background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 8px),linear-gradient(var(--wood),var(--wood2));border:2px solid #e3a869;box-shadow:0 5px 0 #4a2a12,0 12px 20px rgba(0,0,0,.45)}
.slot{background:rgba(40,18,4,.4)}
.pen{background:linear-gradient(135deg,#ffd75e,#ff9f1c);color:#3a2200;font-weight:700}
button{border-radius:12px;padding:10px 8px;box-shadow:0 3px 0 rgba(0,0,0,.3);transition:transform .08s,filter .15s}
button:hover:not(:disabled){filter:brightness(1.1)}button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btns{grid-template-columns:repeat(12,1fr)}
.b-draw{grid-column:span 6;background:linear-gradient(180deg,#5bb8ff,#2563eb);color:#fff}
.b-take{grid-column:span 6;background:linear-gradient(180deg,#34e0c0,#0d9488);color:#04332c}
.b-drop{grid-column:span 3;background:linear-gradient(180deg,#ff7a8c,#e11d48);color:#fff}
.b-sort{grid-column:span 3;background:linear-gradient(180deg,#ffd75e,#f59e0b);color:#3a2200}
.b-csort{grid-column:span 3;background:linear-gradient(180deg,#ff9ad0,#e0489c);color:#fff}
.xk{padding:4px 14px;font-size:13px;background:linear-gradient(180deg,#ff7a8c,#e11d48);color:#fff;box-shadow:0 3px 0 #9f1239}
.ex p{margin:0 0 4px;opacity:.9}
.b-pair{grid-column:span 3;background:linear-gradient(180deg,#b79cff,#7c3aed);color:#fff}
.b-pair.on{background:linear-gradient(180deg,#f5b8ff,#c026d3);box-shadow:0 0 0 3px #fff,0 0 18px #e879f9}
.ov{background:rgba(4,12,30,.72);backdrop-filter:blur(3px)}
.card{background:linear-gradient(180deg,#16396a,#0c2445);border:2px solid rgba(255,255,255,.2);box-shadow:0 22px 50px rgba(0,0,0,.55)}
#lob{background:radial-gradient(620px 420px at 18% 0,rgba(139,92,246,.55),transparent 62%),radial-gradient(620px 420px at 92% 100%,rgba(22,209,176,.45),transparent 62%),#0b2a4a}
.go1{background:linear-gradient(180deg,#34e0c0,#0d9488);color:#04332c;padding:14px;font-size:16px}
.go2{background:linear-gradient(180deg,#ffd75e,#ff9f1c);color:#3a2200;padding:14px;font-size:16px}
.room{color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35)}
.room.mode{display:flex;justify-content:space-between;align-items:center}.room.mode b{font-size:26px}.room.mode small{font-size:13px;margin:0}
.rm0{background:linear-gradient(180deg,#34d399,#059669)}.rm1{background:linear-gradient(180deg,#2dd4bf,#0f766e)}.rm2{background:linear-gradient(180deg,#38bdf8,#0369a1)}.rm3{background:linear-gradient(180deg,#818cf8,#4338ca)}.rm4{background:linear-gradient(180deg,#c084fc,#7e22ce)}.rm5{background:linear-gradient(180deg,#f472b6,#be185d)}.rm6{background:linear-gradient(180deg,#fbbf24,#dc2626)}
.alt{background:rgba(255,255,255,.18);color:#fff}
.bd th .av{display:grid;margin:0 auto 3px}.bd th small{font-size:11px;opacity:.9}
.bd tr:nth-child(even) td{background:rgba(255,255,255,.04)}
.bd tr.cur td{background:rgba(255,200,61,.24)}
.bd sup{font-size:9px;color:#ffd75e;margin-left:2px}
.bd tfoot td{color:#fff}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:rgba(10,20,40,.92);color:#fff;padding:9px 18px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:8;border:1.5px solid #ffc83d}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* chat, profile, timer */
.you{position:relative}
.you.on .av{animation:none}
.rt{display:inline-grid;padding:3px;border-radius:50%}
.you.on .rt{background:conic-gradient(#ffc83d var(--tp,0%),rgba(255,255,255,.18) 0)}
.you.hurry .rt{background:conic-gradient(#ff3b5c var(--tp,0%),rgba(255,255,255,.18) 0);animation:blink2 .5s infinite}
@keyframes blink2{50%{opacity:.55}}
.cd{font:800 13px system-ui,sans-serif;font-style:normal;color:#ffd75e}.you.hurry .cd{color:#ff7a8c}
.lv{font-style:normal;background:linear-gradient(135deg,#ffd75e,#ff9f1c);color:#3a2200;border-radius:6px;padding:0 5px;font:800 10px system-ui,sans-serif}
.bub{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);max-width:170px;white-space:normal;text-align:center;background:#fff;color:#14232b;border-radius:12px;padding:5px 10px;font:700 12px system-ui,sans-serif;box-shadow:0 4px 10px rgba(0,0,0,.35);z-index:4;animation:bpop .25s ease-out}
.bub::after{content:"";position:absolute;left:50%;top:100%;margin-left:-5px;border:5px solid transparent;border-top-color:#fff}
.seat[data-p="3"] .bub{left:0;transform:none}.seat[data-p="1"] .bub{left:auto;right:0;transform:none}
.seat[data-p="3"] .bub::after{left:22px;margin-left:0}.seat[data-p="1"] .bub::after{left:auto;right:22px;margin-left:0}
.you .bub{left:0;transform:none}.you .bub::after{left:22px;margin-left:0}
@keyframes bpop{from{opacity:0;margin-bottom:-8px}}
.ck{position:relative;padding:4px 14px;font-size:13px;background:linear-gradient(180deg,#34e0c0,#0d9488);color:#04332c;box-shadow:0 3px 0 #0a6b62}
.ck em{position:absolute;top:-7px;right:-5px;background:#e11d48;color:#fff;border-radius:999px;font:800 10px system-ui,sans-serif;font-style:normal;padding:2px 6px}
.chatp{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:760px;margin:0 auto;height:min(46vh,380px);display:flex;flex-direction:column;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,#16396a,#0c2445);border:2px solid rgba(255,255,255,.2);border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -12px 30px rgba(0,0,0,.5)}
.chatp[hidden]{display:none}
.ch-h{display:flex;justify-content:space-between;align-items:center}
.ch-h .x{padding:2px 10px;background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
.clist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:13px}
.clist .m{background:rgba(255,255,255,.08);border-radius:10px;padding:4px 10px;align-self:flex-start;max-width:90%}
.clist .m.me{align-self:flex-end;background:rgba(255,200,61,.18)}
.qk,.emo{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.q{flex:0 0 auto;padding:5px 11px;font-size:13px;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;box-shadow:none}
.cin{display:flex;gap:6px}.cin input{flex:1;min-width:0;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.25);color:#fff;padding:8px 12px;font:14px system-ui,sans-serif}
.cin button{padding:8px 14px;margin:0;width:auto}
.prof{display:flex;align-items:center;gap:12px;margin:2px 0 6px}
.av.big{width:46px;height:46px;font-size:22px}
.pinfo{flex:1;display:flex;flex-direction:column;gap:4px}
.xpb{height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}.xpb i{display:block;height:100%;background:linear-gradient(90deg,#34e0c0,#ffd75e)}
.go3{background:linear-gradient(180deg,#f5b8ff,#c026d3);color:#fff;padding:12px}
.rl{max-height:56vh;overflow:auto}.rl h3{margin:10px 0 2px}.rl p{margin:0;font-size:13px;opacity:.92;line-height:1.45}
.st select{background:rgba(0,0,0,.3);color:#fff;border:2px solid rgba(255,255,255,.25);border-radius:10px;padding:5px 8px;font:700 13px system-ui,sans-serif}
/* ıstaka: taş bölmeleri görünmez, düzen ve bırakma alanları aynı */
.rack .slot{background:none!important;box-shadow:none!important;border:0}

/* masa: ahşap kenarlı çuha */

 background:var(--felt) 0 0/64px 64px padding-box,radial-gradient(ellipse at 50% 36%,#23b585 0%,#10815c 46%,#064838 100%) padding-box,var(--grain) 0 0/210px 105px border-box,linear-gradient(180deg,#e0ad6c,#ad6c31 45%,#7b4620) border-box;

.seat[data-p="2"] .bub::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:#fff}
/* rakiplerin ıstakası: tahta üstünde duran taş sırtları */
.backs{box-sizing:border-box;width:100%;max-width:104px;height:26px;padding:0 5px 6px;align-items:flex-end;justify-content:center;border-radius:5px;
 background:var(--grain) 0 0/210px 100px,linear-gradient(180deg,#c98a4a,#8a521f);box-shadow:inset 0 1px 0 rgba(255,235,200,.55),inset 0 -2px 3px rgba(40,18,4,.5),0 2px 4px rgba(0,0,0,.4)}
.backs i{flex:1 1 0;min-width:0;max-width:6px;height:17px;margin:0 .5px;border:0;border-radius:2px 2px 0 0;background:linear-gradient(90deg,#e8d9ab,#fffdf2 45%,#e3d09a);box-shadow:0 -1px 0 rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.45)}
/* atılan taşlar: üst üste, hafif yamuk */
.dz{position:relative;border:1.5px solid rgba(255,255,255,.16);border-radius:9px;background:rgba(0,0,0,.16);box-shadow:inset 0 2px 6px rgba(0,0,0,.4);padding:3px}
.dz .slot{background:none;box-shadow:none}
.dz .t.under{position:absolute;left:50%;top:50%;margin:0;transform:translate(-50%,-50%) translate(var(--x,0),var(--y,0)) rotate(var(--r,0deg));opacity:.92}
.dz .t:not(.under){transform:rotate(calc(var(--r,0deg) * .6))}
.dz.can{border-color:var(--hi);animation:glow 1.2s infinite}
.dz.hot{outline:3px solid #fff;transform:scale(1.1)}
/* deste: yığın kalınlığı taş sayısına göre */
.pile{border:0;border-radius:6px;box-shadow:none;background:linear-gradient(155deg,rgba(255,255,255,.25),transparent 40%),repeating-linear-gradient(45deg,#3a8dff 0 4px,#1b5fd0 4px 8px);outline:3px solid #fff7d1;outline-offset:-3px}
.pile.can{animation:glow 1.1s infinite}
.pile.fin{animation:glow 1s infinite}
.gs .t.ind{transform:none}
@keyframes glow{50%{filter:drop-shadow(0 0 10px #ffd75e) brightness(1.15)}}
/* taşlar: fildişi, kalınlıklı, parlak */
.t{border:0;border-radius:6px;background:linear-gradient(155deg,#fffef8 0%,#fbf1d4 50%,#f0e0b4 100%);text-shadow:0 1px 0 rgba(255,255,255,.9);
 box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(160,130,70,.28),0 1px 0 #dcc995,0 2px 0 #d1bc82,0 3px 0 #c5af73,0 5px 5px rgba(0,0,0,.45)}
.t::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:inherit;background:linear-gradient(150deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 40%);pointer-events:none}
.t.per,.t.lo{border:0}
.t.per{box-shadow:inset 0 1px 0 #fff,inset 0 0 0 1px rgba(160,130,70,.28),0 1px 0 #6ee7a0,0 2px 0 #2fcf6c,0 3px 0 #1ea653,0 5px 5px rgba(0,0,0,.45)}
.t i{box-shadow:inset 0 -1px 1px rgba(0,0,0,.4)}
.t.sel{outline:0;box-shadow:inset 0 1px 0 #fff,0 0 0 3px #fff,0 0 20px 4px rgba(255,200,61,.9),0 9px 10px rgba(0,0,0,.4)}
.t.j{box-shadow:inset 0 1px 0 #fff,0 0 0 2px #ffc83d,0 0 14px rgba(255,200,61,.85),0 4px 5px rgba(0,0,0,.4)}
.t.back{background:linear-gradient(155deg,#4d97ff,#1d4fbd 70%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.38),inset 0 0 12px rgba(0,0,0,.25),0 1px 0 #e8dcb4,0 2px 0 #d8c58f,0 3px 0 #c4ae72,0 5px 5px rgba(0,0,0,.45)}
.t.back::after{display:none}
.t.back::before{text-shadow:0 1px 2px rgba(0,0,0,.5)}
.t.fly{position:fixed;z-index:9;margin:0;pointer-events:none;transition:none}
.t.flip{animation:flipin .34s ease-out backwards}
@keyframes flipin{from{transform:perspective(260px) rotateY(88deg) scale(.9)}}
/* ıstaka: tahta, iki raf, öne çıkan sırt */
.wood{position:relative;border:0;border-radius:16px;padding:13px 10px 20px;
 background:var(--grain) 0 0/210px 105px,radial-gradient(ellipse at 18% 25%,rgba(255,226,170,.28),transparent 55%),linear-gradient(180deg,#dcab6a 0%,#b9783a 24%,#a46a31 58%,#83501f 100%);
 box-shadow:inset 0 2px 0 rgba(255,240,208,.75),inset 0 -5px 9px rgba(50,22,4,.6),inset 5px 0 9px rgba(50,22,4,.3),inset -5px 0 9px rgba(50,22,4,.3),0 0 0 1px #3b1f0a,0 6px 0 #4a2812,0 16px 24px rgba(0,0,0,.55)}
.rack{display:flex;flex-direction:column;gap:19px;grid-template-columns:none}
.shelf{position:relative;display:grid;grid-template-columns:repeat(15,1fr);gap:2px;padding:9px 5px 8px;border-radius:7px 7px 3px 3px;
 background:linear-gradient(180deg,rgba(38,16,3,.62),rgba(38,16,3,.34) 58%,rgba(38,16,3,.12));box-shadow:inset 0 4px 6px rgba(28,10,2,.65),inset 0 -1px 0 rgba(255,225,170,.18)}
.shelf::after{content:"";position:absolute;left:-3px;right:-3px;bottom:-10px;height:14px;z-index:3;pointer-events:none;border-radius:3px 3px 6px 6px;
 background:var(--grain) 0 0/210px 105px,linear-gradient(180deg,#f0c88c 0%,#c78745 46%,#935a27 100%);box-shadow:inset 0 1px 0 rgba(255,244,220,.85),0 3px 4px rgba(0,0,0,.5)}
.rack .t{z-index:1}
/* hareket */
.btns .b-draw:not(:disabled),.btns .b-take:not(:disabled){animation:btnp 1.3s infinite}
@keyframes btnp{50%{filter:brightness(1.2)}}
.ban{position:relative;overflow:hidden;margin:-14px -14px 10px;padding:16px 14px 14px;text-align:center;font:800 20px/1.2 Georgia,serif;color:#3a2200;background:linear-gradient(135deg,#ffe27a,#ffa927);animation:banin .6s cubic-bezier(.2,1.5,.4,1) both}
.ban small{display:block;margin-top:4px;font:700 12px system-ui,sans-serif;opacity:.8}
.ban.lose{background:linear-gradient(135deg,#8aa0d6,#4a5d93);color:#fff}
.ban::after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 1.4s .5s ease-out both}
@keyframes banin{from{transform:scale(.6);opacity:0}}
@keyframes shine{to{left:130%}}
.bd tr.cur td{animation:rowin .55s .2s backwards}

.seat.on .pf .av{border-color:#fff;box-shadow:0 0 0 3px var(--pc),0 0 20px var(--pc),0 4px 8px rgba(0,0,0,.55);animation:ringa 1.6s ease-in-out infinite}
@keyframes ringa{50%{box-shadow:0 0 0 4px var(--pc),0 0 32px var(--pc),0 4px 8px rgba(0,0,0,.55)}}
.seat.mate .pf .av{border-color:#34e0c0}
.seat.mate,.seat.mate.on{box-shadow:none}
.seat.on .who b{background:linear-gradient(180deg,#fff3b0,#f0bd3a);border-color:#8a6414}
.think{height:7px}
.eso,.pt{font-size:9px;padding:1px 7px}
/* rakiplerin ıstakası görünmez; taş uçuşlarının çıkış noktası avatar olur */
.backs{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;padding:0;visibility:hidden;pointer-events:none;background:none;box-shadow:none}
.backs i{display:none}
/* koltuk yerleşimi: üst oyuncu çerçeveye oturur, yan oyuncular kenara yaslanır, attıkları taş masanın ortasına doğru durur */
.seat[data-p="2"]{grid-area:top;margin-top:-50px}
.seat[data-p="3"]{justify-self:start;margin-left:-6px}
.seat[data-p="1"]{justify-self:end;margin-right:-6px}
.dz{min-width:var(--tw);aspect-ratio:3/4;display:grid;place-items:center;padding:0;border:1.5px dashed rgba(255,255,255,.25);border-radius:8px;background:none;box-shadow:none}
.dz:has(.t:not(.under)){border-color:transparent}
.dz.can{border-style:solid}
#mydz{justify-self:end;align-self:end;grid-area:me;position:relative}
/* ben: ortada, çerçeveli avatar + zaman halkası */
.you{grid-area:you;justify-self:center;align-self:end;display:flex;flex-direction:column;align-items:center;gap:3px}
.you .rt{position:relative;border-radius:14px;padding:3px}
.you.on .rt{background:conic-gradient(#ffc83d var(--tp,0%),rgba(255,255,255,.2) 0)}
.you.hurry .rt{background:conic-gradient(#ff3b5c var(--tp,0%),rgba(255,255,255,.2) 0)}
.you .pf .av{width:clamp(46px,12.5vw,60px);height:clamp(46px,12.5vw,60px)}
.you .cd{position:absolute;right:-9px;bottom:-5px;min-width:22px;padding:2px 5px;border-radius:999px;background:#08142a;border:1.5px solid #e8c45e;text-align:center;font:800 12px/1 system-ui,sans-serif;color:#ffe28a;z-index:3}
.you.hurry .cd{color:#ff8a98;border-color:#ff5a72}
.you .bub{left:50%;transform:translateX(-50%)}.you .bub::after{left:50%;margin-left:-5px}
/* orta: deste ve gösterge */
.mid{grid-area:mid;justify-self:center;align-self:center}
.mid .row{gap:12px;align-items:center}
.pile{width:calc(var(--tw) * 1.3);font-size:calc(var(--tw) * .44)}
/* ıstaka: iki yanda dikey sekmeler */
.wood{--tabw:clamp(22px,6vw,34px);display:grid;grid-template-columns:var(--tabw) minmax(0,1fr) var(--tabw);column-gap:4px;box-sizing:border-box;width:min(100%,760px);margin:-2px auto 0;padding:9px 6px 16px;z-index:2}
.rack{grid-column:2;grid-row:1}
.shelf{padding:8px 3px 7px;gap:1px}
.tab{grid-row:1;align-self:stretch;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin:0;padding:6px 0;border-radius:8px;border:1px solid #8c6e2b;background:linear-gradient(90deg,#141414,#3d3d3d 50%,#121212);color:#fff;font:800 clamp(9px,2.5vw,11px)/1 system-ui,sans-serif;letter-spacing:.07em;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 5px rgba(0,0,0,.6)}
.tab.tl{grid-column:1}.tab.tr{grid-column:3}
.tab span{writing-mode:vertical-rl}.tab.tl span{transform:rotate(180deg)}
.tab .ic{width:10px;height:13px;border-radius:2px;background:#fff;transform:rotate(-12deg);box-shadow:4px 1px 0 -1px #c9c9c9,0 0 0 1px #777}
.tab.tr .ic{transform:rotate(12deg);box-shadow:-4px 1px 0 -1px #c9c9c9,0 0 0 1px #777}
.shelf:last-child::after{content:"OKEY";display:grid;place-items:center;font:800 9px/14px Georgia,serif;letter-spacing:.5em;text-indent:.5em;color:rgba(70,34,8,.6);text-shadow:0 1px 0 rgba(255,232,190,.55)}
/* ceza ve çifte git */
#info{width:min(100%,760px);margin:0 auto;box-sizing:border-box;padding:0 4px;gap:8px;justify-content:space-between;align-items:center}
.pen{background:rgba(0,0,0,.38);color:#ffe9a8;border:1px solid rgba(232,196,94,.55)}
.b-pair{padding:5px 14px;border-radius:8px;border:1.5px solid #cfe5ff;background:linear-gradient(180deg,#5cb0ff,#1658c9);color:#fff;font:800 12px/1.2 system-ui,sans-serif;letter-spacing:.06em;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.b-pair.on{border-color:#fff;background:linear-gradient(180deg,#f5b8ff,#c026d3);box-shadow:0 0 0 2px #fff,0 0 16px #e879f9}
/* hamle düğmeleri */
.btns{width:min(100%,760px);margin:0 auto;box-sizing:border-box;grid-template-columns:repeat(12,1fr);gap:6px}
.b-draw,.b-take,.b-drop{grid-column:span 4;padding:9px 4px;font-size:13px;border-radius:10px;border:1.5px solid rgba(255,255,255,.35)}
/* oyun içi kartlar bordo-altın */
#res,#brd,#ext{background:rgba(4,12,32,.74)}
#res .card,#brd .card,#ext .card,.chatp{background:linear-gradient(180deg,#1c4690,#0b2250);border:2px solid #b8913a}
.ban.lose{background:linear-gradient(135deg,#7f9bc9,#33508a);color:#fff}

/* ===== tüm taşlar aynı boyutta, sayı taşın tam ortasında ===== */
:root{--tw:22px}
.t{width:var(--tw);display:grid;place-items:center;font-family:"Times New Roman",Times,"Liberation Serif",serif;font-size:calc(var(--tw) * .84);font-weight:700;line-height:1;letter-spacing:0;font-variant-numeric:lining-nums;border-radius:calc(var(--tw) * .16);box-sizing:border-box;padding:0}
.t .n{display:block;transform:translate(var(--nx,0px),var(--ny,0px))}
.rack .t,.rack .slot{width:auto}
.rack .t,.table .t{font-size:calc(var(--tw) * .84);letter-spacing:0}
.table .t{width:var(--tw)}
.t i{position:absolute;left:50%;bottom:9%;width:.3em;height:.3em;margin:0 0 0 -.15em;transform:none}
.t.back,.rack .t.back,.table .t.back{font-size:0}
.t.back::before{font-size:calc(var(--tw) * .8);line-height:1}
.pile{position:relative;width:var(--tw);font-size:calc(var(--tw) * .55);border-radius:calc(var(--tw) * .16)}

/* ===== Sol oyuncunun atık yığını + sürükle-al, taşı geri bırak, bitiş puanı ===== */
.dz .t.under{transform:translate(-50%,-50%) translate(var(--x,0),var(--y,0)) translate(var(--fan,0px),0) rotate(var(--r,0deg))}
.dz .t.under:nth-last-child(2){--fan:calc((var(--tw,34px) + 2px) * var(--fs,1))}
.dz .t.under:nth-last-child(3){--fan:calc((var(--tw,34px) + 2px) * 2 * var(--fs,1))}
.dz[data-p="3"] .t:not(.under){touch-action:none;cursor:grab}
.dz[data-p="3"].can::after{content:"sürükle";position:absolute;left:0;top:100%;margin-top:6px;padding:1px 7px;border-radius:999px;font:800 9px/1.35 system-ui,sans-serif;letter-spacing:.2px;color:#2a1a00;background:var(--hi);white-space:nowrap;pointer-events:none;z-index:4;box-shadow:0 2px 4px rgba(0,0,0,.4)}
#pile.can::after{content:"sürükle";position:absolute;left:50%;transform:translateX(-50%);bottom:100%;margin-bottom:7px;padding:1px 7px;border-radius:999px;font:800 9px/1.35 system-ui,sans-serif;letter-spacing:.2px;color:#2a1a00;background:var(--hi);white-space:nowrap;pointer-events:none;z-index:4;box-shadow:0 2px 4px rgba(0,0,0,.4)}
#rack .t.hot,#rack .slot.hot{outline:3px solid #fff;outline-offset:-2px;filter:brightness(1.12)}
#rack.hot{outline:3px solid rgba(255,255,255,.75);outline-offset:-3px;border-radius:12px}
.b-undo{background:linear-gradient(180deg,#ffc477,#ee7a1f);color:#2b1200;white-space:nowrap}
.btns .b-undo:not(:disabled){animation:none}
.bd th .gb.gl{color:#ffe08a;background:none;border-color:transparent;padding:1px 0;font-weight:700;opacity:.85}
.bd td.fw{color:#5ee08f;font-weight:800}
/* ===== Telefon yan çevrilince (yatay, kısa ekran): kartlar geniş ve sıkı, kaydırmasız sığar ===== */

 .ov{padding:calc(6px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) calc(10px + env(safe-area-inset-left,0px))}
 .card{max-width:min(94vw,780px);padding:10px 14px}
 #lob .card{max-width:min(94vw,780px)}

 #lob .card .wal{margin:0 0 6px;font-size:15px}
 #lob .card h3{margin:0 0 4px;font-size:13px}
 #lob .card .alt{margin-top:8px;padding:8px}

function showRules(){const L=$('#lob');L.hidden=false;L.innerHTML=`<div class="card"><h2>Kurallar</h2><div class="rl"><h3>Taşlar</h3><p>106 taş: 4 renk (kırmızı, siyah, sarı, mavi) × 1–13 × 2 adet + 2 sahte okey. Her elde bir taş gösterge olur. Okey, göstergenin aynı renkte bir büyüğüdür (13'ün büyüğü 1) ve her taşın yerine geçer. Sahte okey, okey taşının değeri gibi sayılır.</p><h3>Sahte okey eli</h3><p>Gösterge sahte okey çıkarsa o el <b>sahte okey eli</b> olur: ortada tek okey kalır (diğer sahte okey) ve o okey her taşın yerine geçer. O elde ceza çarpanı renkli/renksiz yerine <b>×20</b> ve persiz ele 2000 ceza yazılır. Bitirene: okey atarak (ya da çiftle) bitirene <b>−2000</b>, düz bitirene <b>−200</b>. Göstergeyi yapana (elinde kalan sahte okey, yani okey olana) <b>−200</b>.</p><h3>Dağıtım ve sıra</h3><p>Başlayan oyuncuya 15, diğerlerine 14 taş verilir. İlk elde başlayan rastgeledir; sonraki ellerde başlama sırası bir önceki başlayanın sağındakine geçer. Başlayan çekmeden ilk taşı atar. Sıran gelince ya desteden çekersin ya da solundaki oyuncunun attığı son taşı alırsın, sonra bir taş atarsın. Soldan aldığın taşı aynı hamle içinde geri bırakabilirsin.</p><h3>Süre</h3><p>20 / 30 / 45 / 60 sn ya da kapalı (varsayılan 45). Süre dolunca oyun senin yerine desteden çeker ve çektiği taşı atar.</p><h3>Per</h3><p><b>Seri:</b> aynı renkte ardışık sayılar, en az 3 taş. 12-13-1 geçerli, 13-1-2 geçersiz. <b>Küt:</b> aynı sayı, farklı renkler, 3 ya da 4 taş. Okey, perde istediğin yerin yerine geçer.</p><h3>Çift</h3><p>7 çift: aynı renk ve sayıda iki taş. Okey, herhangi bir taşla çift olur. 7 çiftle el biter ama önce ÇİFTE GİT'e basman gerekir.</p><h3>Bitirme</h3><p>Bütün taşlar perde ya da çiftteyken son taşı destenin üstüne bırak. Perde dışı taş kalmamalı.</p><h3>Renkli ve renksiz el</h3><p>Elin rengini okey belirler: okey kırmızı ya da siyahsa el renkli, mavi ya da sarıysa renksizdir.</p><h3>Ceza</h3><p>Perde dışı kalan taşların sayıları toplanır: renkli elde ×10, renksiz elde ×5 (elde okey kalırsa 50 sayılır). Hiç peri olmayan el: renklide 1000, renksizde 500. Okey atarak ya da çiftle bitişte diğerlerinin cezası 2 katı olur (renklide ×20, renksizde ×10). Çift giden ve eli bitiremeyen oyuncunun cezası ayrıca 2 katıdır. Elinde okey varken bir taş çekip okeyi atarak bitirebilecek durumdaki oyuncu, başkası eli bitirirse renklide 1000, renksizde 500 ceza alır. Sahte okeyle bitişte ceza 20 katı olur (sahte okey elinde bu uygulanmaz; el zaten ×20'dir).</p><h3>Bitirene puan</h3><p>Eli bitiren oyuncunun skoruna eksi puan yazılır (0 yazılmaz): renkli elde −100, renksiz elde −50. Okey atarak ya da çiftle bitişte renkli −1000, renksiz −500. Sahte okeyle bitişte renkli −2000, renksiz −200. Bu puan satıra yazılmaz: skor tablosunda oyuncunun isminin üstünde (birden fazla bonus toplanarak) gösterilir, o elin satırında bitiren oyuncunun yanına ✓ konur. Toplam puana bu bonus da dahildir.</p><h3>Gösterge</h3><p>Elinde göstergenin aynısı olan oyuncu GÖSTERGE der: renkli elde −100, renksiz elde −50 puan. Bu puan da isim üstündeki bonusa eklenir, o elin satırında ★ ile işaretlenir.</p><h3>PAT</h3><p>Deste biterse el <b>PAT</b> olur: o ele hiçbir puan yazılmaz (ne ceza ne bonus) ve <b>aynı el yeniden oynanır</b> — el sayacı ilerlemez. Yeniden oynanan elde her şey 2 katıdır: renkli elde ceza ×20 ve bitirene −200 (okey atarak ya da çiftle bitişte ceza ×40, bitirene −2000); renksiz elde ceza ×10 ve bitirene −100 (okeyle ×20, bitirene −1000). Gösterge bonusu da 2 katı yazılır. Tekrar oynanan el yine PAT olursa çarpan katlanır (×4, ×8 …). Sonraki eller normale döner.</p><h3>Parti</h3><p>Masaya girerken 7, 11 ya da 13 elli oyun seçilir. Masa ücreti masaya girerken bakiyenden düşer. Masalar dört kategoridedir: Amatörler (100 – 5.000 çip, baştan açık), Kalfalar (10.000 – 30.000 çip, Seviye 5), Ustalar (40.000 – 80.000 çip, Seviye 15) ve Prolar (100.000 – 1.000.000 çip, Seviye 30); seviye atladıkça yeni kategoriler açılır. Dört oyuncunun ücretinden oluşan havuzu (masa ücreti × 4), son elin sonunda toplam puanı en düşük olan alır; eşitlikte havuz paylaşılır. Çevrim dışı modda (HEMEN OYNA) ücret ve ödül yoktur. Partiyi yarıda bırakırsan ücret iade edilmez ve ödül verilmez.</p><h3>Eşli oyun</h3><p>Eşin karşında oturur. İkinizin cezaları toplanır, toplamı en düşük takım havuzu alır ve havuz iki eş arasında bölünür. Eşin eli bitirirse takım bitirmiş sayılır.</p></div><button class="alt" data-a="tour">Nasıl oynanır? (öğretici)</button><button class="alt" data-a="home">Geri</button></div>`}
